<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 248" preserveAspectRatio="none">
  <defs>
    <filter id="tornPaper" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="4" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11"/>
    </filter>
    <filter id="tornEdge" x="-8%" y="-12%" width="116%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.08" numOctaves="4" seed="23" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="14"/>
    </filter>
    <g id="paw">
      <ellipse cx="0" cy="7" rx="10" ry="8"/>
      <ellipse cx="-10" cy="-3" rx="4" ry="5.2" transform="rotate(-22 -10 -3)"/>
      <ellipse cx="-2.5" cy="-7.5" rx="4" ry="5.2"/>
      <ellipse cx="6.5" cy="-6.5" rx="4" ry="5.2" transform="rotate(14 6.5 -6.5)"/>
      <ellipse cx="13.5" cy="-1" rx="3.6" ry="4.8" transform="rotate(32 13.5 -1)"/>
    </g>
  </defs>

  <!-- 撕邊白色紙背 -->
  <rect x="5" y="5" width="342" height="238" rx="3" fill="#fcf7e7" filter="url(#tornEdge)"/>

  <!-- 黃色便簽紙本體（毛邊） -->
  <rect x="11" y="11" width="330" height="226" fill="#f9eda6" filter="url(#tornPaper)"/>
  <rect x="11" y="11" width="330" height="226" fill="#fdf3bd" opacity="0.35" filter="url(#tornPaper)"/>

  <!-- 橫線 -->
  <g stroke="#fdf4c8" stroke-width="2.2" opacity="0.9">
    <line x1="36" y1="76" x2="316" y2="76"/>
    <line x1="36" y1="104" x2="316" y2="104"/>
    <line x1="36" y1="132" x2="316" y2="132"/>
    <line x1="36" y1="160" x2="316" y2="160"/>
    <line x1="36" y1="188" x2="316" y2="188"/>
  </g>

  <!-- 腳印裝飾 -->
  <g fill="#eed77f" opacity="0.8">
    <use href="#paw" transform="translate(34 30) scale(0.62) rotate(-18)"/>
    <use href="#paw" transform="translate(26 196) scale(0.58) rotate(-10)"/>
    <use href="#paw" transform="translate(58 212) scale(0.5) rotate(14)"/>
  </g>
  <g fill="#f2dd88" opacity="0.85">
    <use href="#paw" transform="translate(300 200) scale(1.05) rotate(16)"/>
  </g>
</svg>
